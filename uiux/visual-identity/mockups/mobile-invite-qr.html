<!doctype html>
<html lang="fr" data-theme="dark" data-export-width="390">
<head>
<meta charset="utf-8">
<title>Here! — Page invité : présence confirmée, QR code</title>
<link rel="stylesheet" href="../typography/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="_mobile.css">
<style>
  body { font-size: var(--text-guest-size); }
  .ok { text-align: center; padding: var(--space-4) var(--space-5) 0; }
  .ok i { width: 52px; height: 52px; color: var(--color-success); }
  .ok h1 { font-family: var(--font-heading); font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; margin-top: var(--space-2); }
  .ok p { font-size: 16px; color: var(--color-text-muted); margin-top: var(--space-2); }
  .pass { margin: var(--space-5) var(--space-5) 0; border-radius: var(--radius-lg); background: var(--color-white); color: var(--color-ink); padding: var(--space-5); text-align: center; position: relative; overflow: hidden; }
  .pass .qr { width: 220px; height: 220px; margin: 0 auto; position: relative; }
  .pass .qr img { width: 100%; height: 100%; display: block; }
  .pass .qr .m { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; background: var(--color-white); padding: 4px; border-radius: 10px; }
  .pass .qr .m img { border-radius: 8px; }
  .pass b { display: block; font-family: var(--font-heading); font-weight: 600; font-size: 20px; margin-top: var(--space-4); }
  .pass .meta { display: flex; justify-content: center; gap: var(--space-4); margin-top: 6px; font-size: 15px; color: var(--color-gray-600); }
  .pass .meta strong { color: var(--color-ink); }
  .pass .code { font-family: var(--font-mono); font-size: 13px; letter-spacing: .04em; color: var(--color-gray-600); margin-top: var(--space-3); }
  .hint { display: flex; gap: var(--space-2); align-items: center; justify-content: center; margin-top: var(--space-4); font-size: 14px; color: var(--color-text-muted); }
  .hint i { width: 18px; height: 18px; }
  .when { margin: var(--space-5) var(--space-5) 0; padding: var(--space-4); border-radius: var(--radius-md); background: var(--color-surface); display: grid; gap: var(--space-2); font-size: 15px; }
  .when div { display: flex; justify-content: space-between; }
  .when span { color: var(--color-text-muted); }
  .chg { text-align: center; margin-top: var(--space-4); font-size: 14px; color: var(--color-accent-text); font-weight: 600; }
</style>
</head>
<body>
  <div class="status"><span>9:12</span><span class="sys"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 27 12"><rect x="0" y="0" width="23" height="12" rx="3" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.5"/><rect x="24.5" y="4" width="2" height="4" rx="1" opacity=".4"/></svg></span></div>
  <div class="ok">
    <i data-icon="valide"></i>
    <h1>Vous êtes attendus !</h1>
    <p>Aya &amp; Koffi ont bien reçu votre réponse.</p>
  </div>
  <div class="pass">
    <div class="qr"><img src="qr-invitation.svg" alt="QR code d'entrée"><span class="m"><img src="../logo/svg/favicon.svg" alt=""></span></div>
    <b>M. et Mme Konan</b>
    <div class="meta"><span><strong>2</strong> personnes</span><span>Table <strong>4</strong></span></div>
    <div class="code">INV-AK26-0142</div>
  </div>
  <div class="hint"><i data-icon="scanner"></i>Présentez ce code à l'entrée</div>
  <div class="when">
    <div><span>Cérémonie</span><b>Sam. 13 déc · 15 h</b></div>
    <div><span>Réception</span><b>19 h · Espace Les Jardins</b></div>
  </div>
  <div class="chg">Modifier ma réponse</div>
  <span class="home-ind"></span>
  <script src="_icons.js"></script>
</body>
</html>
