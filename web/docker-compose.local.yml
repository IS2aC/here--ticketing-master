# Usage local uniquement (pas sur Dokploy, qui passe par son proxy) :
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  here-db:
    ports:
      - "${DB_PORT:-5433}:5432"
  here-api:
    ports:
      - "${API_PORT:-8000}:8000"
  here-frontend:
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
