# Here! · infrastructure complète
#   db        PostgreSQL 16
#   migrate   migrations SQL (dbmate), exécutées puis arrêtées avant le démarrage de l'API
#   api       FastAPI : seule à accéder à la base ; appelée par le frontend et la future app mobile
#   frontend  Next.js : interface web, appelle l'API par le réseau interne
#   worker    envoi WhatsApp (WasenderAPI) : invitations et relances, une à la fois, au rythme anti-blocage
#
# Dokploy : application de type « Docker Compose », chemin web/docker-compose.yml,
# variables dans l'onglet Environment (voir .env.example). Domaines à créer dans Dokploy :
#   frontend → port 3000 (ex. here.example.com)
#   api      → port 8000 (ex. api.here.example.com, utilisé aussi par l'app mobile)

x-database-url: &database-url postgres://${POSTGRES_USER:-here}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}@db:5432/${POSTGRES_DB:-here}

# Envoi WhatsApp, commun à l'API (suivi, webhooks) et au worker (envoi). Voir .env.example.
x-whatsapp: &whatsapp
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}
  WASENDER_API_KEY: ${WASENDER_API_KEY:-}
  WASENDER_WEBHOOK_SECRET: ${WASENDER_WEBHOOK_SECRET:-}
  WHATSAPP_MIN_DELAY_SECONDS: ${WHATSAPP_MIN_DELAY_SECONDS:-20}
  WHATSAPP_MAX_DELAY_SECONDS: ${WHATSAPP_MAX_DELAY_SECONDS:-45}
  WHATSAPP_BATCH_SIZE: ${WHATSAPP_BATCH_SIZE:-25}
  WHATSAPP_BATCH_PAUSE_MINUTES: ${WHATSAPP_BATCH_PAUSE_MINUTES:-30}
  WHATSAPP_SEND_START_HOUR: ${WHATSAPP_SEND_START_HOUR:-8}
  WHATSAPP_SEND_END_HOUR: ${WHATSAPP_SEND_END_HOUR:-20}
  WHATSAPP_REMINDER_DAYS_BEFORE: ${WHATSAPP_REMINDER_DAYS_BEFORE:-7}
  WHATSAPP_CALL_DELAY_DAYS: ${WHATSAPP_CALL_DELAY_DAYS:-2}
  WHATSAPP_ON_DEMAND_REMINDERS: ${WHATSAPP_ON_DEMAND_REMINDERS:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-here}
      POSTGRES_USER: ${POSTGRES_USER:-here}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./db
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-here}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-here}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    restart: unless-stopped
    environment:
      <<: *whatsapp
      DATABASE_URL: *database-url
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      # Adresse publique du site : lien porté par le QR code des cartes (/i/<jeton>).
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  # Un seul worker par numéro WhatsApp : ne pas le dupliquer (replicas), sous peine de blocage du numéro.
  worker:
    build: ./api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *whatsapp
      DATABASE_URL: *database-url
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
